<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#3a2a35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>My. UniqueStory – Sticker-Editor</title>
  <style>
:root {
  --bg: #fbf5f3;
  --card: #ffffff;
  --ink: #3a2a35;
  --muted: #8a7783;
  --line: #ecdfe0;
  --rose: #c9567f;
  --rose-dark: #a8416a;
  --rose-soft: #fbe3ec;
  --plum: #3a2a35;
  --radius: 14px;
  --app-h: 100dvh;
  --top-h: 60px;
  --tools-w: 92px;
  --panel-w: 330px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h2 { margin: 0; font-size: 16px; }

#app { height: var(--app-h); display: grid; overflow: hidden;
  grid-template-columns: var(--tools-w) 1fr var(--panel-w);
  grid-template-rows: var(--top-h) 1fr;
  grid-template-areas: "top top top" "tools stage panel"; }
#topbar { grid-area: top; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 0 14px; background: var(--card); border-bottom: 1px solid var(--line); z-index: 5; }
.top-left, .top-right { display: flex; align-items: center; gap: 10px; }

/* ---------- Logo ---------- */
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; background: var(--plum);
  color: #fff; padding: 5px 14px 5px 8px; border-radius: 999px; box-shadow: 0 2px 10px rgba(58, 42, 53, .25); }
.flower { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
.brand-name { font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-weight: 700; font-size: 20px; letter-spacing: .3px; white-space: nowrap; }

/* ---------- Buttons ---------- */
.primary { background: var(--rose); color: #fff; border: 0; border-radius: 999px; padding: 11px 20px;
  font-weight: 650; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; }
.primary:hover { background: var(--rose-dark); }
.primary:disabled { opacity: .55; cursor: default; }
.secondary { background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; min-height: 44px; font-weight: 600; }
.secondary:hover { border-color: var(--rose); }
.danger { color: #b3261e; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover:not(:disabled) { background: var(--rose-soft); }
.icon-btn:disabled { opacity: .3; cursor: default; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Werkzeugleiste ---------- */
#tools { grid-area: tools; background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 6px;
  display: flex; flex-direction: column; gap: 2px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; border: 0;
  background: transparent; font-size: 11.5px; line-height: 1.15; text-align: center; min-height: 54px; }
.tool:hover { background: var(--rose-soft); }
.tool.active { background: var(--rose-soft); color: var(--rose-dark); font-weight: 650; }
.tool.add { background: var(--rose); color: #fff; margin-bottom: 6px; font-weight: 650; }
.tool.add:hover { background: var(--rose-dark); }
.tool:disabled { opacity: .35; cursor: default; }
.tool-sep { height: 1px; background: var(--line); margin: 6px 6px; flex: none; }

/* ---------- Arbeitsfläche ---------- */
#stage { grid-area: stage; position: relative; display: grid; place-items: center; overflow: hidden; background: #f0e6e6; touch-action: none; }
#board { position: relative; box-shadow: 0 6px 30px rgba(58, 42, 53, .18); border-radius: 4px; overflow: visible;
  /* Karomuster NUR als CSS-Hintergrund – niemals im Canvas/Export */
  background-color: #fff;
  background-image: linear-gradient(45deg, #e4e0e0 25%, transparent 25%, transparent 75%, #e4e0e0 75%),
                    linear-gradient(45deg, #e4e0e0 25%, transparent 25%, transparent 75%, #e4e0e0 75%);
  background-size: 24px 24px; background-position: 0 0, 12px 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#ui { position: absolute; inset: 0; overflow: visible; touch-action: none; }

.selbox { position: absolute; left: 0; top: 0; transform-origin: 0 0; border: 1.5px dashed var(--rose); pointer-events: none; }
.selbox.editing { pointer-events: auto; border-style: solid; padding: 0; cursor: move; }
.selbox.editing::before { content: ""; position: absolute; inset: -14px; } /* greifbarer Rand zum Verschieben während des Schreibens */
.selbox .h { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: #fff;
  border: 2px solid var(--rose); display: grid; place-items: center; pointer-events: auto; touch-action: none; color: var(--rose-dark); }
.selbox .h svg.i { width: 16px; height: 16px; stroke-width: 2.2; pointer-events: none; }
.selbox .h[data-h="resize"] { left: 100%; top: 100%; cursor: nwse-resize; }
.selbox .h[data-h="rotate"] { left: 50%; top: -34px; cursor: grab; }
.selbox .h[data-h="del"] { left: 0; top: 0; color: #b3261e; border-color: #b3261e; }
.selbox .h[data-h="dup"] { left: 100%; top: 0; }
.selbox .rot-line { position: absolute; left: 50%; top: -22px; height: 22px; border-left: 1.5px solid var(--rose); pointer-events: none; }
.editor { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: pre; color: transparent;
  caret-color: #e0457b; outline: none; min-width: 20px; min-height: 1em; cursor: text; padding: 0; margin: 0;
  background: transparent; -webkit-user-select: text; user-select: text; text-align: center; }
.edit-done { position: absolute; left: 50%; top: calc(100% + 14px); transform: translateX(-50%); pointer-events: auto; white-space: nowrap;
  background: var(--rose); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 650; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.edit-hint { position: absolute; left: 50%; top: calc(100% + 56px); transform: translateX(-50%); font-size: 12px; color: var(--ink);
  background: rgba(255,255,255,.92); padding: 4px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; }

#toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--plum); color: #fff; padding: 10px 16px; border-radius: 12px; max-width: 90%; text-align: center; transition: .25s; z-index: 20; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { background: #b3261e; }

/* ---------- Einstellungsbereich ---------- */
#panel { grid-area: panel; background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--line); }
#panel-close { display: none; }
#panel-body { overflow-y: auto; padding: 14px 16px 24px; flex: 1; -webkit-overflow-scrolling: touch; }
.hint { color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.row > label, .lbl { font-size: 13px; color: var(--muted); font-weight: 600; min-width: 84px; }
.field { margin: 14px 0; }
.field > .lbl { display: block; margin-bottom: 6px; }
input[type=range] { flex: 1; accent-color: var(--rose); height: 28px; min-width: 0; }
input[type=number], input[type=text], input[type=password], select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; font: inherit; min-height: 42px; }
input[type=number] { width: 78px; flex: none; }
input:focus, select:focus { outline: 2px solid var(--rose-soft); border-color: var(--rose); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; min-width: 44px; padding: 9px 8px; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; min-height: 42px; font-size: 13.5px; }
.seg button.on { background: var(--rose-soft); border-color: var(--rose); color: var(--rose-dark); font-weight: 650; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-weight: 600; }
.switch input { width: 46px; height: 26px; accent-color: var(--rose); }
.section-sep { height: 1px; background: var(--line); margin: 16px 0; }

.swatches { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: 8px; border: 1.5px solid rgba(0,0,0,.14); padding: 0; min-width: 24px; }
.sw.on { outline: 2.5px solid var(--rose); outline-offset: 1.5px; }
.hexrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.hexrow .chip { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid rgba(0,0,0,.14); flex: none; }
.hexrow input[type=text] { flex: 1; text-transform: uppercase; }
.hexrow input[type=color] { width: 44px; height: 42px; padding: 2px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; flex: none; }
.err-msg { color: #b3261e; font-size: 13px; margin-top: 6px; min-height: 0; }

.font-list { display: flex; flex-direction: column; gap: 6px; }
.font-item { text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 24px; min-height: 52px; line-height: 1.2; }
.font-item.on { border-color: var(--rose); background: var(--rose-soft); }
.font-item small { display: block; font: 11px sans-serif; color: var(--muted); margin-top: 2px; }

.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
.cats button { flex: none; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; min-height: 38px; }
.cats button.on { background: var(--rose); border-color: var(--rose); color: #fff; }
.emoji-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.emoji-grid button { aspect-ratio: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px; display: grid; place-items: center; }
.emoji-grid button:hover { border-color: var(--rose); background: var(--rose-soft); }
.emoji-grid img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }

.layer { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 6px; background: #fff; }
.layer.on { border-color: var(--rose); background: var(--rose-soft); }
.layer .nm { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .nm small { display: block; color: var(--muted); font-size: 11px; }
.layer.hid .nm { opacity: .45; }
.layer .tb { width: 36px; height: 36px; border-radius: 9px; border: 0; background: transparent; display: grid; place-items: center; }
.layer .tb:hover:not(:disabled) { background: rgba(201, 86, 127, .15); }
.layer .tb:disabled { opacity: .25; }
.layer .tb svg.i { width: 18px; height: 18px; }
.layer input.rn { min-height: 36px; padding: 6px 8px; }
.layer-tools { display: flex; gap: 4px; flex-wrap: wrap; }

/* ---------- Dialoge ---------- */
#modal { position: fixed; inset: 0; background: rgba(58, 42, 53, .55); display: grid; place-items: center; z-index: 50; padding: 12px; }
#modal[hidden] { display: none; }
.modal-card { background: #fff; border-radius: 18px; width: min(560px, 100%); max-height: calc(var(--app-h) - 24px); overflow: auto; padding: 8px 18px 20px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; padding: 8px 0; z-index: 1; }
.preview-wrap { background-color: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: grid; place-items: center; min-height: 160px;
  background-image: linear-gradient(45deg, #e4e0e0 25%, transparent 25%, transparent 75%, #e4e0e0 75%), linear-gradient(45deg, #e4e0e0 25%, transparent 25%, transparent 75%, #e4e0e0 75%);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; }
.preview-wrap img { max-width: 100%; max-height: 38vh; object-fit: contain; -webkit-touch-callout: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn-row > * { flex: 1; justify-content: center; }
.note { background: var(--rose-soft); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; margin-top: 12px; }
.proj { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 8px; }
.proj .meta { flex: 1; min-width: 0; }
.proj .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta small { color: var(--muted); }

/* ---------- Smartphone / schmale Fenster ---------- */
@media (max-width: 860px) {
  :root { --top-h: 56px; --tools-h: 66px; }
  #app { grid-template-columns: 1fr; grid-template-rows: var(--top-h) 1fr auto auto; grid-template-areas: "top" "stage" "panel" "tools"; }
  .brand-name { font-size: 16px; }
  .flower { width: 28px; height: 28px; }
  .brand { padding: 4px 10px 4px 6px; gap: 5px; }
  .primary { padding: 10px 14px; }
  .dl-text { display: none; }
  #tools { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); overflow-x: auto; overflow-y: hidden; gap: 2px; }
  .tool { min-width: 62px; flex: none; min-height: 58px; }
  .tool-sep { width: 1px; height: auto; margin: 6px 4px; }
  .tool.add { margin: 0 6px 0 0; }
  #panel { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(58,42,53,.12); }
  #panel.collapsed { display: none; }
  #panel-close { display: grid; }
  #stage { min-height: 120px; }
  body.kbd #panel, body.kbd #tools { display: none; }
}
@media (max-width: 400px) {
  .brand-name { font-size: 14.5px; }
  .top-left .icon-btn { width: 38px; }
}
@media (hover: none) { .selbox .h { width: 34px; height: 34px; margin: -17px 0 0 -17px; } }

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="top-left">
      <button class="icon-btn" id="btn-undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"></button>
      <button class="icon-btn" id="btn-redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"></button>
    </div>
    <div class="top-right">
      <a class="brand" href="#" aria-label="My. UniqueStory">
        <svg class="flower" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="petal" cx="50%" cy="85%" r="95%">
              <stop offset="0" stop-color="#f58bb0"/>
              <stop offset="1" stop-color="#ffc2d8"/>
            </radialGradient>
          </defs>
          <g transform="translate(32 32)" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" fill="url(#petal)">
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(0)"/>
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(60)"/>
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(120)"/>
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(180)"/>
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(240)"/>
            <ellipse rx="9" ry="15" cy="-14" transform="rotate(300)"/>
            <circle r="7" fill="#fff3b8" stroke="#ffffff"/>
            <circle r="3" fill="#f2b84b" stroke="none"/>
          </g>
        </svg>
        <span class="brand-name">My. UniqueStory</span>
      </a>
      <button class="primary" id="btn-download"><span class="dl-ico"></span><span class="dl-text">Download</span></button>
    </div>
  </header>

  <nav id="tools" aria-label="Werkzeuge"></nav>

  <main id="stage">
    <div id="board">
      <canvas id="cv"></canvas>
      <div id="ui"></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside id="panel" aria-label="Einstellungen">
    <div class="panel-head"><h2 id="panel-title"></h2><button class="icon-btn" id="panel-close" aria-label="Einstellungen schließen"></button></div>
    <div id="panel-body"></div>
  </aside>
</div>

<div id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Schließen"></button></div>
    <div id="modal-body"></div>
  </div>

<script>
/* Einzeldatei-Version: Es gibt keinen Server. Schriften/Emojis stecken in der Datei,
   Projekte der Kundinnen werden nur im Browser des jeweiligen Geräts gespeichert (privat). */
(function () {
  'use strict';
  var CAT = window.MUS_CATALOG || { fonts: [], emojis: [] };
  var KEY = 'mus.standalone.projects';
  var mem = null;
  function load() { if (mem) return mem; try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function save(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); mem = null; return true; }
    catch (e) { if (e && (e.name === 'QuotaExceededError' || e.code === 22)) return false; mem = o; return true; }
  }
  function rid() { var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function res(status, body) { return new Response(JSON.stringify(body), { status: status, headers: { 'Content-Type': 'application/json' } }); }
  function clean(s) { return String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 80); }
  function validData(d) {
    if (!d || typeof d !== 'object' || !Array.isArray(d.layers) || d.layers.length > 200) return false;
    return d.layers.every(function (l) { return l && typeof l === 'object' && (l.type === 'text' || l.type === 'emoji'); });
  }
  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, opt) {
    var url = typeof input === 'string' ? input : input && input.url;
    if (typeof url !== 'string' || url.indexOf('/api/') !== 0) return realFetch(input, opt);
    var method = ((opt && opt.method) || 'GET').toUpperCase();
    var body = null; try { body = opt && opt.body ? JSON.parse(opt.body) : null; } catch (e) { return Promise.resolve(res(400, { error: 'Ungültige Anfrage.' })); }
    var p = load(), m;
    if (url === '/api/catalog') {
      var cats = [];
      CAT.emojis.forEach(function (e) { if (e.category && cats.indexOf(e.category) < 0) cats.push(e.category); });
      return Promise.resolve(res(200, {
        fonts: CAT.fonts.map(function (f) { return { id: f.id, name: f.name, url: f.url }; }),
        emojis: CAT.emojis.map(function (e) { return { id: e.id, name: e.name, category: e.category || '', url: e.url }; }),
        categories: cats,
      }));
    }
    if (url === '/api/projects') {
      if (method === 'GET') return Promise.resolve(res(200, { projects: Object.keys(p).map(function (k) { return { id: k, name: p[k].name, updated: p[k].updated }; }).sort(function (a, b) { return b.updated - a.updated; }) }));
      if (method === 'POST') {
        if (Object.keys(p).length >= 60) return Promise.resolve(res(400, { error: 'Du hast die maximale Anzahl gespeicherter Projekte erreicht. Bitte lösche ein altes Projekt.' }));
        if (!body || !validData(body.data)) return Promise.resolve(res(400, { error: 'Ungültiges Projekt.' }));
        var id = rid(), now = Date.now();
        p[id] = { name: clean(body.name) || 'Mein Sticker', data: body.data, updated: now };
        if (!save(p)) return Promise.resolve(res(507, { error: 'Der Speicher deines Browsers ist voll. Bitte lösche alte Projekte.' }));
        return Promise.resolve(res(201, { id: id, name: p[id].name, updated: now }));
      }
    }
    m = /^\/api\/projects\/([a-f0-9]{32})$/.exec(url);
    if (m) {
      var pr = Object.prototype.hasOwnProperty.call(p, m[1]) ? p[m[1]] : null;
      if (!pr) return Promise.resolve(res(404, { error: 'Projekt nicht gefunden.' }));
      if (method === 'GET') return Promise.resolve(res(200, { id: m[1], name: pr.name, data: pr.data, updated: pr.updated }));
      if (method === 'PUT') {
        if (!body || !validData(body.data)) return Promise.resolve(res(400, { error: 'Ungültiges Projekt.' }));
        pr.data = body.data; if (clean(body.name)) pr.name = clean(body.name); pr.updated = Date.now();
        if (!save(p)) return Promise.resolve(res(507, { error: 'Der Speicher deines Browsers ist voll. Bitte lösche alte Projekte.' }));
        return Promise.resolve(res(200, { id: m[1], name: pr.name, updated: pr.updated }));
      }
      if (method === 'DELETE') { delete p[m[1]]; save(p); return Promise.resolve(res(200, { ok: true })); }
    }
    return Promise.resolve(res(404, { error: 'Nicht gefunden' }));
  };
})();

<script>
'use strict';
/**
 * Render-Engine: EINE Gestaltungslogik für Vorschau UND PNG-Export.
 * Die Arbeitsfläche ist 1080 × 1920 (Instagram-Story). Alle Ebenen-Koordinaten
 * sind in diesem Raum; x/y ist der Mittelpunkt der (ungebogenen) Ebene.
 * Das Karomuster und alle Editor-Hilfen sind reines DOM/CSS und nie Teil des Canvas.
 */
(function () {
  const MUS = (window.MUS = {});
  MUS.ART_W = 1080;
  MUS.ART_H = 1920;

  const measure = document.createElement('canvas').getContext('2d');

  // ------------------------------------------------------------ Schriften
  MUS.fonts = new Map(); // id -> {id,name,url,family,status,promise}
  MUS.SYSTEM_FONT = { id: 'system', name: 'Standard', family: '"Helvetica Neue", Arial, sans-serif', status: 'ok' };

  MUS.familyFor = function (fontId) {
    const f = MUS.fonts.get(fontId);
    if (f && f.status === 'ok') return `"${f.family}", ${MUS.SYSTEM_FONT.family}`;
    return MUS.SYSTEM_FONT.family;
  };

  MUS.loadFont = function (f) {
    if (f.id === 'system') return Promise.resolve(true);
    if (f.status === 'ok') return Promise.resolve(true);
    if (f.promise) return f.promise;
    f.status = 'loading';
    f.promise = (async () => {
      try {
        const face = new FontFace(f.family, `url(${f.url})`);
        await face.load();
        document.fonts.add(face);
        f.status = 'ok';
        return true;
      } catch (e) {
        f.status = 'failed';
        f.promise = null; // erneuter Versuch möglich
        return false;
      }
    })();
    return f.promise;
  };

  MUS.syncFonts = function (list) {
    const ids = new Set(list.map((x) => x.id));
    for (const id of [...MUS.fonts.keys()]) if (!ids.has(id)) MUS.fonts.delete(id);
    for (const x of list) {
      const old = MUS.fonts.get(x.id);
      if (old && old.url === x.url) { old.name = x.name; continue; }
      let hsh = 5381; for (let i = 0; i < x.url.length; i++) hsh = ((hsh * 33) ^ x.url.charCodeAt(i)) >>> 0;
      MUS.fonts.set(x.id, { id: x.id, name: x.name, url: x.url, family: 'f_' + String(x.id).replace(/[^\w]/g, '') + '_' + hsh.toString(36), status: 'idle', promise: null });
    }
  };

  // ------------------------------------------------------------ Bilder (Emojis)
  MUS.images = new Map(); // url -> {img, status, promise}
  MUS.loadImage = function (url) {
    let e = MUS.images.get(url);
    if (e && (e.status === 'ok' || e.promise)) return e.promise || Promise.resolve(true);
    if (!e) { e = { img: new Image(), status: 'idle', promise: null }; MUS.images.set(url, e); }
    e.status = 'loading';
    e.promise = new Promise((resolve) => {
      e.img.onload = () => { e.status = 'ok'; resolve(true); };
      e.img.onerror = () => { e.status = 'failed'; e.promise = null; resolve(false); };
      e.img.src = url;
    });
    return e.promise;
  };
  MUS.emojiMap = new Map(); // emojiId -> {id,name,url}

  // ------------------------------------------------------------ Layout
  function fontString(L) { return `${L.fontSize}px ${MUS.familyFor(L.fontId)}`; }

  /** Berechnet Glyphen-/Zeilenpositionen. Ursprung = Mitte des ungebogenen Textblocks. */
  MUS.layoutText = function (L, forceFlat) {
    const size = L.fontSize;
    const lh = size * (L.lineHeight || 1.15);
    measure.font = fontString(L);
    const fm = measure.measureText('Hg');
    const asc = fm.fontBoundingBoxAscent != null ? fm.fontBoundingBoxAscent : size * 0.8;
    const desc = fm.fontBoundingBoxDescent != null ? fm.fontBoundingBoxDescent : size * 0.2;
    const ls = L.letterSpacing || 0;
    const rawLines = String(L.text || '').split('\n');

    const infos = rawLines.map((t) => {
      const chars = Array.from(t);
      const offs = [0];
      let pre = '';
      for (let i = 0; i < chars.length; i++) {
        pre += chars[i];
        offs.push(measure.measureText(pre).width + ls * (i + 1));
      }
      const width = chars.length ? Math.max(0, offs[chars.length] - ls) : 0;
      return { text: t, chars, offs, width };
    });
    const Wmax = Math.max(0, ...infos.map((i) => i.width));
    const H = infos.length * lh;
    const baseline = (i) => -H / 2 + i * lh + (lh - (asc + desc)) / 2 + asc;
    const startX = (w) => (L.align === 'left' ? -Wmax / 2 : L.align === 'right' ? Wmax / 2 - w : -w / 2);

    const items = [];
    let bb;
    const bend = forceFlat ? 0 : L.bend || 0;

    if (!bend) {
      infos.forEach((inf, i) => {
        const x0 = startX(inf.width), y = baseline(i);
        if (!inf.chars.length) return;
        if (!ls) items.push({ kind: 'line', text: inf.text, x: x0, y });
        else inf.chars.forEach((ch, k) => {
          const gw = inf.offs[k + 1] - inf.offs[k] - ls;
          items.push({ kind: 'glyph', ch, x: x0 + inf.offs[k] + gw / 2, y, rot: 0 });
        });
      });
      bb = { x0: -Wmax / 2, y0: -H / 2, x1: Wmax / 2, y1: H / 2 };
    } else {
      const s = bend > 0 ? 1 : -1;
      const alpha = (Math.abs(bend) / 100) * (Math.PI * 5 / 3); // bis 300°
      // Radius: nie so klein, dass Buchstaben der inneren Zeile ineinanderfallen oder Zeilen sich kreuzen
      const R = Math.max(Math.max(Wmax, size) / alpha, size * 2 + (infos.length - 1) * lh);
      const yb0 = baseline(0);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      infos.forEach((inf, i) => {
        const r = Math.max(R - s * i * lh, lh * 0.15);
        const x0 = startX(inf.width);
        inf.chars.forEach((ch, k) => {
          const gw = inf.offs[k + 1] - inf.offs[k] - ls;
          const u = x0 + inf.offs[k] + gw / 2;
          const phi = u / r;
          const px = r * Math.sin(phi);
          const py = yb0 + s * (R - r * Math.cos(phi));
          const rot = s * phi;
          items.push({ kind: 'glyph', ch, x: px, y: py, rot });
          const c = Math.cos(rot), sn = Math.sin(rot);
          for (const [cx, cy] of [[-gw / 2, -asc], [gw / 2, -asc], [-gw / 2, desc], [gw / 2, desc]]) {
            const wx = px + cx * c - cy * sn, wy = py + cx * sn + cy * c;
            if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
            if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
          }
        });
      });
      bb = isFinite(minX) ? { x0: minX, y0: minY, x1: maxX, y1: maxY } : { x0: -Wmax / 2, y0: -H / 2, x1: Wmax / 2, y1: H / 2 };
    }
    return { items, bb, size, lh, asc, desc, Wmax, H, empty: !rawLines.some((l) => l.length) };
  };

  /** Lokale Begrenzung (relativ zum Ebenen-Mittelpunkt) für Auswahlrahmen/Treffer. */
  MUS.layerBounds = function (L, forceFlat) {
    if (L.type === 'emoji') {
      const e = MUS.emojiMap.get(L.emojiId);
      const im = e && MUS.images.get(e.url);
      const ar = im && im.status === 'ok' && im.img.naturalWidth ? im.img.naturalHeight / im.img.naturalWidth : 1;
      const w = L.size, h = L.size * ar;
      return { x0: -w / 2, y0: -h / 2, x1: w / 2, y1: h / 2 };
    }
    const lay = MUS.layoutText(L, forceFlat);
    const bb = Object.assign({}, lay.bb);
    if (lay.empty || bb.x1 - bb.x0 < 40) { // leerer Rahmen soll sichtbar/greifbar sein
      const cx = (bb.x0 + bb.x1) / 2;
      bb.x0 = cx - 70; bb.x1 = cx + 70;
    }
    if (L.bg && L.bg.on && !lay.empty) {
      const px = L.bg.padX * L.fontSize, py = L.bg.padY * L.fontSize;
      bb.x0 -= px; bb.x1 += px; bb.y0 -= py; bb.y1 += py;
    }
    return bb;
  };

  /** Zusätzlicher Rand, den Effekte (Kontur/Schatten) über die Grenzen hinaus brauchen. */
  MUS.effectMargin = function (L) {
    let m = 4;
    if (L.type === 'text') {
      if (L.stroke && L.stroke.on) m += L.stroke.width;
      if (L.shadow && L.shadow.on) m += L.shadow.dist + L.shadow.blur * 2.5;
    }
    return m;
  };

  function rrect(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hexToRgba(hex, a) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex) || [null, '000000'];
    const n = parseInt(m[1], 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function drawItems(ctx, lay, mode) {
    for (const it of lay.items) {
      if (it.kind === 'line') {
        ctx.textAlign = 'left';
        if (mode === 'stroke') ctx.strokeText(it.text, it.x, it.y); else ctx.fillText(it.text, it.x, it.y);
      } else {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rot);
        ctx.textAlign = 'center';
        if (mode === 'stroke') ctx.strokeText(it.ch, 0, 0); else ctx.fillText(it.ch, 0, 0);
        ctx.restore();
      }
    }
  }

  /** Zeichnet den Inhalt einer Textebene (ohne Schatten) in lokalen Koordinaten. */
  function drawTextContent(ctx, L, forceFlat) {
    const lay = MUS.layoutText(L, forceFlat);
    if (lay.empty) return;
    if (L.bg && L.bg.on) {
      const px = L.bg.padX * L.fontSize, py = L.bg.padY * L.fontSize;
      ctx.fillStyle = L.bg.color;
      rrect(ctx, lay.bb.x0 - px, lay.bb.y0 - py, lay.bb.x1 - lay.bb.x0 + 2 * px, lay.bb.y1 - lay.bb.y0 + 2 * py, L.bg.radius * L.fontSize);
      ctx.fill();
    }
    ctx.font = fontString(L);
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

      ctx.strokeStyle = L.stroke.color;

    ctx.fillStyle = L.color;
    drawItems(ctx, lay, 'fill');
  }

  function drawEmojiContent(ctx, L) {
    const e = MUS.emojiMap.get(L.emojiId);
    const im = e && MUS.images.get(e.url);
    if (!im || im.status !== 'ok') return false;
    const b = MUS.layerBounds(L);
    if (L.shadow && L.shadow.on) { /* Schatten wird außen gesetzt */ }

    return true;
  }

  function isRenderable(L) {
    if (L.hidden) return false;
    if (L.type === 'text') return String(L.text || '').length > 0 && /\S/.test(L.text);
    const e = MUS.emojiMap.get(L.emojiId);
    const im = e && MUS.images.get(e.url);

  function applyLayerTransform(c, L, scale, tx, ty) {
    c.translate(tx, ty);
    c.scale(scale, scale);
    c.translate(L.x, L.y);
    c.rotate((L.rotation * Math.PI) / 180);
  }

  /**
   * Zeichnet alle Ebenen (Reihenfolge = Array-Reihenfolge, hinten → vorne).
   * view: {scale, tx, ty}  – bildet Arbeitsflächen-Koordinaten auf Canvas-Pixel ab.
   * editingFlat: Id der Ebene, die gerade bearbeitet wird (wird ungebogen gezeigt,
   *              damit der Cursor exakt sitzt).
   */
  MUS.render = function (ctx, layers, view, editingFlatId) {
    const { scale, tx, ty } = view;
    for (const L of layers) {
      if (!isRenderable(L)) continue;
      const flat = L.id === editingFlatId;
      const hasShadow = L.shadow && L.shadow.on;

      ctx.save();
      if (L.type === 'text' && hasShadow) {
        // Eigene Zwischenebene → genau EIN sauberer Schatten für Fläche+Kontur+Text zusammen.
        const b = MUS.layerBounds(L, flat);
        const m = MUS.effectMargin(L);
        const th = (L.rotation * Math.PI) / 180, c = Math.cos(th), s = Math.sin(th);
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const [px, py] of [[b.x0 - m, b.y0 - m], [b.x1 + m, b.y0 - m], [b.x0 - m, b.y1 + m], [b.x1 + m, b.y1 + m]]) {
          const wx = (L.x + px * c - py * s) * scale + tx, wy = (L.y + px * s + py * c) * scale + ty;
          if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
          if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
        }
        const bx = Math.floor(minX), by = Math.floor(minY);
        const bw = Math.min(4096, Math.ceil(maxX) - bx + 1), bh = Math.min(4096, Math.ceil(maxY) - by + 1);
        if (bw > 0 && bh > 0) {
          const off = document.createElement('canvas');
          off.width = bw; off.height = bh;
          const o = off.getContext('2d');

          drawTextContent(o, L, flat);
          const ang = (L.shadow.angle * Math.PI) / 180;
          ctx.shadowColor = hexToRgba(L.shadow.color, L.shadow.opacity);
          ctx.shadowBlur = L.shadow.blur * scale;
          ctx.shadowOffsetX = Math.cos(ang) * L.shadow.dist * scale;
          ctx.shadowOffsetY = Math.sin(ang) * L.shadow.dist * scale;
          ctx.drawImage(off, bx, by);
        }
      } else if (L.type === 'emoji' && hasShadow) {
        const off = document.createElement('canvas');
        const b = MUS.layerBounds(L);
        const m = 4;
        const th = (L.rotation * Math.PI) / 180, c = Math.cos(th), s = Math.sin(th);
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const [px, py] of [[b.x0 - m, b.y0 - m], [b.x1 + m, b.y0 - m], [b.x0 - m, b.y1 + m], [b.x1 + m, b.y1 + m]]) {
          const wx = (L.x + px * c - py * s) * scale + tx, wy = (L.y + px * s + py * c) * scale + ty;
          if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
          if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
        }

        ctx.shadowBlur = L.shadow.blur * scale;
        ctx.shadowOffsetX = Math.cos(ang) * L.shadow.dist * scale;
        ctx.shadowOffsetY = Math.sin(ang) * L.shadow.dist * scale;
        ctx.drawImage(off, bx, by);

        applyLayerTransform(ctx, L, scale, tx, ty);
        if (L.type === 'text') drawTextContent(ctx, L, flat); else drawEmojiContent(ctx, L);
      }
      ctx.restore();
    }
  };

  // ------------------------------------------------------------ Export
  MUS.layersExtent = function (layers) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const L of layers) {
      if (!isRenderable(L)) continue;
      const b = MUS.layerBounds(L);
      const m = MUS.effectMargin(L) + 8;
      const th = (L.rotation * Math.PI) / 180, c = Math.cos(th), s = Math.sin(th);
      for (const [px, py] of [[b.x0 - m, b.y0 - m], [b.x1 + m, b.y0 - m], [b.x0 - m, b.y1 + m], [b.x1 + m, b.y1 + m]]) {
        const wx = L.x + px * c - py * s, wy = L.y + px * s + py * c;
        if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
        if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
      }
    }
    return isFinite(minX) ? { x0: minX, y0: minY, x1: maxX, y1: maxY } : null;
  };

  /** Stellt sicher, dass alle verwendeten Schriften und Bilder geladen sind – sonst Fehler. */
  MUS.ensureAssets = async function (layers) {
    const problems = [];
    const fontIds = new Set(layers.filter((l) => l.type === 'text' && /\S/.test(l.text || '')).map((l) => l.fontId));
    for (const id of fontIds) {
      if (id === 'system') continue;
      const f = MUS.fonts.get(id);
      if (!f) { problems.push('Eine verwendete Schriftart ist nicht mehr verfügbar.'); continue; }
      let ok = await MUS.loadFont(f);
      if (!ok) ok = await MUS.loadFont(f); // ein zweiter Versuch
      if (!ok) problems.push(`Die Schriftart „${f.name}“ konnte nicht geladen werden.`);
      else await document.fonts.load(`40px "${f.family}"`, 'Ag');
    }
    for (const L of layers) {
      if (L.type !== 'emoji' || L.hidden) continue;
      const e = MUS.emojiMap.get(L.emojiId);
      if (!e) { problems.push('Ein verwendetes Emoji ist nicht mehr verfügbar.'); continue; }
      const ok = await MUS.loadImage(e.url);
      if (!ok) problems.push(`Das Emoji „${e.name}“ konnte nicht geladen werden.`);
    }
    if (problems.length) throw Object.assign(new Error(problems[0]), { problems });
  };

  /**
   * Erzeugt ein PNG mit echtem Alpha-Kanal.
   * mode 'crop'  – nur der gestaltete Inhalt, eng beschnitten (mit kleinem Rand)
   * mode 'story' – volle Story-Fläche 1080 × 1920
   */
  MUS.exportPNG = async function (layers, mode) {
    await MUS.ensureAssets(layers);
    const visible = layers.filter(isRenderable);
    if (!visible.length) throw Object.assign(new Error('Dein Sticker ist noch leer. Füge zuerst Text oder ein Emoji hinzu.'), { empty: true });

    let canvas;
    if (mode === 'story') {
      canvas = document.createElement('canvas');
      canvas.width = MUS.ART_W; canvas.height = MUS.ART_H;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      MUS.render(ctx, layers, { scale: 1, tx: 0, ty: 0 });
    } else {
      const ext = MUS.layersExtent(layers);
      const w = ext.x1 - ext.x0, h = ext.y1 - ext.y0;
      const scale = Math.min(2, 4096 / Math.max(w, h), Math.sqrt(16e6 / (w * h)));
      canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.ceil(w * scale)); canvas.height = Math.max(1, Math.ceil(h * scale));
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      MUS.render(ctx, layers, { scale, tx: -ext.x0 * scale, ty: -ext.y0 * scale });
      // Eng beschneiden: so bleibt nichts abgeschnitten und es entsteht kein unnötiger Leerraum.
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          if (data[(y * canvas.width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) throw Object.assign(new Error('Dein Sticker ist noch leer. Füge zuerst Text oder ein Emoji hinzu.'), { empty: true });
      const pad = Math.round(12 * scale);
      const cx0 = Math.max(0, minX - pad), cy0 = Math.max(0, minY - pad);
      const cx1 = Math.min(canvas.width, maxX + 1 + pad), cy1 = Math.min(canvas.height, maxY + 1 + pad);
      const out = document.createElement('canvas');
      out.width = cx1 - cx0; out.height = cy1 - cy0;
      out.getContext('2d').drawImage(canvas, cx0, cy0, out.width, out.height, 0, 0, out.width, out.height);
      canvas = out;
    }
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Das PNG konnte nicht erzeugt werden. Bitte versuche es erneut.');
    return { blob, width: canvas.width, height: canvas.height };
  };

  // ------------------------------------------------------------ Farben
  MUS.normalizeHex = function (s) {
    s = String(s || '').trim();
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s);
    if (!m) return null;
    let h = m[1];
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    return '#' + h.toUpperCase();
  };
  MUS.luminance = function (hex) {
    const n = parseInt(hex.slice(1), 16);
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f((n >> 16) & 255) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
  };
})();

  function defaultShadow() { return { on: false, color: '#000000', opacity: 0.4, blur: 14, dist: 10, angle: 90 }; }
  function newText() {
    const f = S.catalog.fonts[0];
    return {
      id: uid(), type: 'text', name: '', text: '', fontId: f ? f.id : 'system', fontSize: 130,
      color: '#000000', align: 'center', lineHeight: 1.15, letterSpacing: 0,
      x: ART_W / 2, y: 700 + (S.layers.length % 6) * 40, rotation: 0, bend: 0, hidden: false,
      bg: { on: false, color: '#FFFFFF', radius: 0.25, padX: 0.35, padY: 0.2, auto: false },
      shadow: defaultShadow(), stroke: { on: false, color: '#FFFFFF', width: 8 },
    };
  }
  function newEmoji(e) {
    return { id: uid(), type: 'emoji', name: '', emojiId: e.id, size: 320, x: ART_W / 2, y: 760 + (S.layers.length % 6) * 40, rotation: 0, hidden: false, shadow: defaultShadow() };
  }
  const num = (v, a, b, d) => (typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : d);
  const hex = (v, d) => MUS.normalizeHex(v) || d;
  const ALIGN = ['left', 'center', 'right'];
  function normShadow(s) {
    const d = defaultShadow(); s = s && typeof s === 'object' ? s : {};
    return { on: !!s.on, color: hex(s.color, d.color), opacity: num(s.opacity, 0, 1, d.opacity), blur: num(s.blur, 0, 100, d.blur), dist: num(s.dist, 0, 200, d.dist), angle: num(s.angle, 0, 360, d.angle) };
  }
  /** Bereinigt Ebenen aus Entwurf/Server (nie ungeprüft übernehmen). */
  function normalizeLayer(r) {
    if (!r || typeof r !== 'object') return null;
    const base = {
      id: typeof r.id === 'string' && /^[\w-]{1,40}$/.test(r.id) ? r.id : uid(),
      name: typeof r.name === 'string' ? r.name.slice(0, 40) : '',
      x: num(r.x, -500, ART_W + 500, ART_W / 2), y: num(r.y, -500, ART_H + 500, ART_H / 2),
      rotation: num(r.rotation, -360, 360, 0), hidden: !!r.hidden, shadow: normShadow(r.shadow),
    };
    if (r.type === 'emoji') return Object.assign(base, { type: 'emoji', emojiId: String(r.emojiId || ''), size: num(r.size, 16, 1600, 320) });
    if (r.type !== 'text') return null;
    const t = newText(), bg = r.bg || {}, st = r.stroke || {};
    return Object.assign(base, {
      type: 'text', text: String(r.text == null ? '' : r.text).slice(0, 300), fontId: String(r.fontId || 'system'),
      fontSize: num(r.fontSize, 12, 700, 130), color: hex(r.color, '#000000'), align: ALIGN.includes(r.align) ? r.align : 'center',
      lineHeight: num(r.lineHeight, 0.7, 3, 1.15), letterSpacing: num(r.letterSpacing, -20, 100, 0), bend: num(r.bend, -100, 100, 0),
      bg: { on: !!bg.on, color: hex(bg.color, '#FFFFFF'), radius: num(bg.radius, 0, 2, 0.25), padX: num(bg.padX, 0, 3, 0.35), padY: num(bg.padY, 0, 3, 0.2), auto: !!bg.auto },
      stroke: { on: !!st.on, color: hex(st.color, '#FFFFFF'), width: num(st.width, 0, 80, 8) },
    });
  }

  // ------------------------------------------------------------------ Zeichnen
  const cv = $('#cv'), board = $('#board'), ui = $('#ui'), stage = $('#stage');
  const ctx = cv.getContext('2d');
  let rafId = 0;
  function schedule() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      MUS.render(ctx, S.layers, { scale: S.sc * S.dpr, tx: 0, ty: 0 }, S.editingId);
    });
  }
  function fit() {
    const r = stage.getBoundingClientRect();
    const pad = mobileMQ.matches ? 8 : 24;
    S.sc = Math.max(0.05, Math.min((r.width - pad * 2) / ART_W, (r.height - pad * 2) / ART_H));
    S.dpr = Math.min(window.devicePixelRatio || 1, 3);
    board.style.width = ART_W * S.sc + 'px';
    board.style.height = ART_H * S.sc + 'px';
    cv.width = Math.round(ART_W * S.sc * S.dpr);
    cv.height = Math.round(ART_H * S.sc * S.dpr);
    schedule();
    positionOverlay();
  }

  // ------------------------------------------------------------------ Verlauf (Rückgängig / Wiederholen)
  const snapshot = () => JSON.stringify({ layers: S.layers, selId: S.selId });
  const layersKey = () => JSON.stringify(S.layers);
  S.keys = [];
  function pushHistory() {
    const key = layersKey();
    if (S.keys[S.hi] === key) { S.history[S.hi] = snapshot(); return; } // nur Auswahl geändert → kein neuer Schritt
    S.history = S.history.slice(0, S.hi + 1);
    S.keys = S.keys.slice(0, S.hi + 1);
    S.history.push(snapshot());
    S.keys.push(key);
    if (S.history.length > 100) { S.history.shift(); S.keys.shift(); }
    S.hi = S.history.length - 1;
    afterChange();
  }
  function restore(i) {
    const o = JSON.parse(S.history[i]);
    S.hi = i;
    S.editingId = null;
    S.layers = o.layers;
    S.selId = o.selId && layer(o.selId) ? o.selId : null;
    preloadAssets();
    buildOverlay(); schedule(); renderPanel(); afterChange(true);
  }
  function undo() { if (S.editingId) commitEditText(); if (S.hi > 0) restore(S.hi - 1); }
  function redo() { if (S.hi < S.history.length - 1) restore(S.hi + 1); }
  let saveTimer = 0;
  function afterChange(skipSave) {
    $('#btn-undo').disabled = S.hi <= 0;
    $('#btn-redo').disabled = S.hi >= S.history.length - 1;
    document.querySelectorAll('[data-act=undo]').forEach((b) => (b.disabled = S.hi <= 0));
    document.querySelectorAll('[data-act=redo]').forEach((b) => (b.disabled = S.hi >= S.history.length - 1));
    if (skipSave === true) return autosaveSoon();
    autosaveSoon();
  }
  function autosaveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem('mus.draft', JSON.stringify({ layers: S.layers, projectId: S.projectId, projectName: S.projectName })); } catch { /* voll/blockiert */ }
    }, 400);
  }

  function mutate(fn, opt) {
    const o = Object.assign({ commit: true, panel: false }, opt);
    const L = sel(); if (!L) return;
    fn(L);
    schedule(); positionOverlay();
    if (o.commit) pushHistory();
    if (o.panel) renderPanel();
  }

  // ------------------------------------------------------------------ Toast
  let toastTimer = 0;
  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ''), err ? 6000 : 2600);
  }

  // ------------------------------------------------------------------ Katalog
  async function loadCatalog() {
    try {
      const c = await api('GET', '/api/catalog');
      S.catalog = c;
      MUS.syncFonts(c.fonts);
      MUS.emojiMap = new Map(c.emojis.map((e) => [e.id, e]));
      for (const f of MUS.fonts.values()) MUS.loadFont(f).then(() => { schedule(); positionOverlay(); if (S.tool === 'font') refreshFontList(); });
      preloadAssets();
    } catch (e) { toast('Schriften und Emojis konnten nicht geladen werden. ' + e.message, true); }
  }
  function preloadAssets() {
    for (const L of S.layers) if (L.type === 'emoji') {
      const e = MUS.emojiMap.get(L.emojiId);
      if (e) MUS.loadImage(e.url).then(() => { schedule(); positionOverlay(); });
    }
  }

  // ------------------------------------------------------------------ Auswahl & Overlay
  let ov = null; // {box, id, editor}
  function select(id) {
    if (S.selId === id) return;
    if (S.editingId && S.editingId !== id) endEdit();
    S.selId = id;
    buildOverlay(); renderPanel();
  }
  function deselect() { endEdit(); S.selId = null; buildOverlay(); renderPanel(); }

  function buildOverlay() {
    ui.textContent = '';
    ov = null;
    const L = sel();
    if (!L || L.hidden) return;
    const editing = S.editingId === L.id;
    const box = h('div', { class: 'selbox' + (editing ? ' editing' : '') });
    box.append(
      h('div', { class: 'rot-line' }),
      h('div', { class: 'h', 'data-h': 'rotate', title: 'Drehen', html: ico('rotate') }),
      h('div', { class: 'h', 'data-h': 'resize', title: 'Größe ändern', html: ico('size') }),
      h('div', { class: 'h', 'data-h': 'del', title: 'Löschen', html: ico('close') }),
      h('div', { class: 'h', 'data-h': 'dup', title: 'Duplizieren', html: ico('copy') }),
    );
    let editor = null;
    if (editing) {
      const mode = supportsPlaintext() ? 'plaintext-only' : 'true';
      editor = h('div', { class: 'editor', contenteditable: mode, spellcheck: 'false', autocapitalize: 'sentences', autocorrect: 'off', role: 'textbox', 'aria-label': 'Text direkt auf der Arbeitsfläche eingeben', 'data-mode': mode });
      editor.textContent = L.text;
      editor.addEventListener('input', onEditorInput);
      editor.addEventListener('paste', (e) => {
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, t);
      });
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); endEdit(); }
      });
      box.append(editor, h('button', { class: 'edit-done', type: 'button', onclick: () => endEdit() }, 'Fertig'));
      if (L.bend) box.append(h('div', { class: 'edit-hint' }, 'Die Biegung wird nach dem Schreiben angezeigt'));
    }
    ui.append(box);
    ov = { box, id: L.id, editor };
    positionOverlay();
    if (editor) editor.focus();
  }
  let plainSupport = null;
  function supportsPlaintext() {
    if (plainSupport === null) {
      const t = document.createElement('div');
      try { t.contentEditable = 'plaintext-only'; } catch { /* nicht unterstützt */ }
      plainSupport = t.contentEditable === 'plaintext-only';
    }
    return plainSupport;
  }
  function positionOverlay() {
    if (!ov) return;
    const L = layer(ov.id);
    if (!L) return;
    const editing = S.editingId === L.id;
    const sc = S.sc;
    const b = MUS.layerBounds(L, editing);
    ov.box.style.width = (b.x1 - b.x0) * sc + 'px';
    ov.box.style.height = (b.y1 - b.y0) * sc + 'px';
    ov.box.style.transform = `translate(${L.x * sc}px,${L.y * sc}px) rotate(${L.rotation}deg) translate(${b.x0 * sc}px,${b.y0 * sc}px)`;
    if (ov.editor) {
      const e = ov.editor.style;
      e.fontFamily = MUS.familyFor(L.fontId);
      e.fontSize = L.fontSize * sc + 'px';
      e.lineHeight = L.fontSize * (L.lineHeight || 1.15) * sc + 'px';
      e.letterSpacing = (L.letterSpacing || 0) * sc + 'px';
      e.textAlign = L.align;
    }
  }
  function readEditorText(ed) {
    let t = ed.dataset.mode === 'plaintext-only' ? ed.textContent : ed.innerText;
    return t.replace(/\r/g, '').replace(/ /g, ' ').slice(0, 300);
  }
  let editCommitTimer = 0;
  function onEditorInput() {
    const L = layer(S.editingId); if (!L || !ov || !ov.editor) return;
    L.text = readEditorText(ov.editor);
    schedule(); positionOverlay();
    clearTimeout(editCommitTimer);
    editCommitTimer = setTimeout(commitEditText, 700);
    autosaveSoon();
  }
  function commitEditText() {
    clearTimeout(editCommitTimer);
    if (S.editingId) pushHistory();
  }
  function startEdit(id) {
    if (S.editingId && S.editingId !== id) endEdit();
    const L = layer(id);
    if (!L || L.type !== 'text') return;
    S.selId = id; S.editingId = id;
    buildOverlay(); schedule(); renderPanel();
    // Cursor ans Ende setzen
    const ed = ov && ov.editor;
    if (ed) {
      ed.focus();
      const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }
  function endEdit() {
    if (!S.editingId) return;
    clearTimeout(editCommitTimer);
    const id = S.editingId, L = layer(id);
    S.editingId = null;
    if (document.activeElement && document.activeElement.classList.contains('editor')) document.activeElement.blur();
    if (L && !/\S/.test(L.text)) { // leerer Textrahmen wird verworfen (kein eigener Verlaufsschritt)
      S.layers = S.layers.filter((x) => x.id !== id);
      if (S.selId === id) S.selId = null;
    }
    pushHistory();
    buildOverlay(); schedule(); renderPanel();
  }

  // ------------------------------------------------------------------ Ebenen-Aktionen
  function addText() {
    endEdit();
    const L = newText();
    S.layers.push(L);
    S.selId = L.id; S.editingId = L.id;
    if (mobileMQ.matches) S.panelOpen = false;
    syncPanelVisibility();
    buildOverlay(); schedule(); renderPanel(); // Verlaufsschritt erst, wenn Text eingegeben wurde
  }
  function addEmoji(e) {
    endEdit();
    const L = newEmoji(e);
    MUS.loadImage(e.url).then((ok) => {
      if (!ok) { toast(`Das Emoji „${e.name}“ konnte nicht geladen werden.`, true); S.layers = S.layers.filter((x) => x.id !== L.id); if (S.selId === L.id) S.selId = null; buildOverlay(); schedule(); renderPanel(); return; }
      S.layers.push(L); S.selId = L.id;
      buildOverlay(); schedule(); renderPanel(); pushHistory();
    });
  }
  function duplicateLayer(id) {
    endEdit();
    const L = layer(id); if (!L) return;
    const c = JSON.parse(JSON.stringify(L));
    c.id = uid(); c.x = clamp(L.x + 40, 0, ART_W); c.y = clamp(L.y + 40, 0, ART_H);
    if (c.name) c.name = c.name.slice(0, 34) + ' Kopie';
    const i = S.layers.indexOf(L);
    S.layers.splice(i + 1, 0, c);
    S.selId = c.id;
    buildOverlay(); schedule(); renderPanel(); pushHistory();
  }
  function deleteLayer(id) {
    if (S.editingId === id) { S.editingId = null; clearTimeout(editCommitTimer); }
    S.layers = S.layers.filter((l) => l.id !== id);
    if (S.selId === id) S.selId = null;
    buildOverlay(); schedule(); renderPanel(); pushHistory();
  }
  function moveLayer(id, how) {
    const i = S.layers.findIndex((l) => l.id === id); if (i < 0) return;
    const [L] = S.layers.splice(i, 1);
    let j = how === 'up' ? i + 1 : how === 'down' ? i - 1 : how === 'top' ? S.layers.length : 0;
    j = clamp(j, 0, S.layers.length);
    S.layers.splice(j, 0, L);
    schedule(); renderPanel(); pushHistory();
  }

  // ------------------------------------------------------------------ Zeiger (Verschieben, Größe, Drehen, Pinch)
  const pointers = new Map();
  let drag = null;
  const boardPt = (e) => { const r = board.getBoundingClientRect(); return { x: (e.clientX - r.left) / S.sc, y: (e.clientY - r.top) / S.sc }; };

  function hitTest(pt) {
    const m = 14 / S.sc;
    for (let i = S.layers.length - 1; i >= 0; i--) {
      const L = S.layers[i];
      if (L.hidden || (L.type === 'text' && !/\S/.test(L.text) && L.id !== S.selId)) continue;
      if (L.type === 'emoji' && !MUS.isRenderable(L)) continue;
      const th = (-L.rotation * Math.PI) / 180, c = Math.cos(th), s = Math.sin(th);
      const dx = pt.x - L.x, dy = pt.y - L.y;
      const lx = dx * c - dy * s, ly = dx * s + dy * c;
      const b = MUS.layerBounds(L, S.editingId === L.id);
      if (lx >= b.x0 - m && lx <= b.x1 + m && ly >= b.y0 - m && ly <= b.y1 + m) return L;
    }
    return null;
  }

  ui.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.editor') || e.target.closest('.edit-done')) return; // native Texteingabe
    if (e.button != null && e.button > 0) return;
    pendingTapEdit = null;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { ui.setPointerCapture(e.pointerId); } catch { /* egal */ }
    const hd = e.target.closest('.h');
    const L0 = sel();

    // Zweiter Finger → Pinch (Größe + Drehen) auf der gewählten Ebene
    if (pointers.size === 2 && L0 && !S.editingId) {
      const [a, b] = [...pointers.values()];
      drag = { mode: 'pinch', id: L0.id, d0: Math.hypot(a.x - b.x, a.y - b.y), a0: Math.atan2(b.y - a.y, b.x - a.x), rot0: L0.rotation, size0: L0.type === 'text' ? L0.fontSize : L0.size, changed: false };
      return;
    }
    if (pointers.size > 1) return;

    if (hd && L0) {
      const k = hd.dataset.h;
      if (k === 'del') { deleteLayer(L0.id); return; }
      if (k === 'dup') { duplicateLayer(L0.id); return; }
      const r = board.getBoundingClientRect();
      const cx = r.left + L0.x * S.sc, cy = r.top + L0.y * S.sc;
      drag = { mode: k, id: L0.id, cx, cy, sx: e.clientX, sy: e.clientY, orig: JSON.parse(JSON.stringify(L0)), changed: false };
      return;
    }
    if (e.target.classList.contains('selbox') && S.editingId && L0) { // Rahmen während des Schreibens → verschieben
      drag = { mode: 'move', id: L0.id, sx: e.clientX, sy: e.clientY, ox: L0.x, oy: L0.y, changed: false, tap: false };
      return;
    }
    const L = hitTest(boardPt(e));
    if (L) {
      const wasSelected = S.selId === L.id;
      if (!wasSelected) select(L.id);
      drag = { mode: 'move', id: L.id, sx: e.clientX, sy: e.clientY, ox: L.x, oy: L.y, changed: false, tap: wasSelected && L.type === 'text' };
    } else {
      deselect();
      drag = null;
    }
  });

  ui.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!drag) return;
    const L = layer(drag.id); if (!L) return;
    if (drag.mode === 'move') {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.changed && Math.hypot(dx, dy) < 4) return;
      drag.changed = true;
      L.x = clamp(drag.ox + dx / S.sc, 0, ART_W);
      L.y = clamp(drag.oy + dy / S.sc, 0, ART_H);
    } else if (drag.mode === 'resize') {
      const d0 = Math.hypot(drag.sx - drag.cx, drag.sy - drag.cy) || 1;
      const f = Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy) / d0;
      if (L.type === 'text') L.fontSize = clamp(drag.orig.fontSize * f, 12, 700); else L.size = clamp(drag.orig.size * f, 16, 1600);
      drag.changed = true;
    } else if (drag.mode === 'rotate') {
      const a = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) - Math.atan2(drag.sy - drag.cy, drag.sx - drag.cx);
      let deg = drag.orig.rotation + (a * 180) / Math.PI;
      deg = ((deg + 540) % 360) - 180;
      const snap = Math.round(deg / 45) * 45;
      if (!e.altKey && Math.abs(deg - snap) < 4) deg = snap;
      L.rotation = Math.round(deg * 10) / 10;
      drag.changed = true;
    } else if (drag.mode === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x);
      const f = d / (drag.d0 || 1);
      if (L.type === 'text') L.fontSize = clamp(drag.size0 * f, 12, 700); else L.size = clamp(drag.size0 * f, 16, 1600);
      let deg = drag.rot0 + ((ang - drag.a0) * 180) / Math.PI;
      L.rotation = Math.round((((deg + 540) % 360) - 180) * 10) / 10;
      drag.changed = true;
    }
    schedule(); positionOverlay();
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    try { ui.releasePointerCapture(e.pointerId); } catch { /* egal */ }
    if (!drag) return;
    if (drag.mode === 'pinch' && pointers.size > 0) { if (drag.changed) pushHistory(); drag = null; return; }
    const d = drag; drag = null;
    if (d.changed) { pushHistory(); renderPanelValues(); }
    else if (d.mode === 'move' && d.tap && e.type === 'pointerup') pendingTapEdit = d.id; // wird im „click“ ausgeführt (nötig für die iOS-Tastatur)
  }
  let pendingTapEdit = null;
  ui.addEventListener('click', () => { const id = pendingTapEdit; pendingTapEdit = null; if (id && layer(id)) startEdit(id); });
  ui.addEventListener('pointerup', endPointer);
  ui.addEventListener('pointercancel', endPointer);
  ui.addEventListener('dblclick', (e) => {
    const L = hitTest(boardPt(e));
    if (L && L.type === 'text') startEdit(L.id);
  });

  // ------------------------------------------------------------------ Bedienelemente für das Panel
  function slider(label, o) {
    const r = h('input', { type: 'range', min: o.min, max: o.max, step: o.step || 1, value: o.value, 'aria-label': label });
    const n = h('input', { type: 'number', min: o.min, max: o.max, step: o.step || 1, value: o.value, 'aria-label': label + ' (Zahl)' });
    r.addEventListener('input', () => { n.value = r.value; o.set(+r.value, false); });
    r.addEventListener('change', () => o.set(+r.value, true));
    n.addEventListener('input', () => { const v = +n.value; if (n.value !== '' && v >= o.min && v <= o.max) { r.value = v; o.set(v, false); } });
    n.addEventListener('change', () => { const v = clamp(+n.value || 0, o.min, o.max); n.value = v; r.value = v; o.set(v, true); });
    return h('div', { class: 'row' }, h('label', {}, label), r, n);
  }
  function switchRow(label, on, set) {
    const c = h('input', { type: 'checkbox', role: 'switch', 'aria-label': label });
    c.checked = on;
    c.addEventListener('change', () => set(c.checked));
    return h('label', { class: 'switch' }, h('span', {}, label), c);
  }
  function seg(items, current, set) {
    return h('div', { class: 'seg' }, items.map(([val, label]) => h('button', { type: 'button', class: val === current ? 'on' : '', onclick: () => set(val) }, label)));
  }
  /** Farbwähler: Farbfelder + HEX-Eingabe + Systemfarbwähler. Jede Eigenschaft hat ihren eigenen. */
  function colorPicker(value, onInput, onCommit) {
    let cur = value;
    const wrap = h('div', { class: 'field' });

    const marks = [];

      cur = c; chip.style.background = c; inp.value = c; pick.value = c.toLowerCase(); err.textContent = '';
      marks.forEach(([b, v]) => b.classList.toggle('on', v === c));

    });
    inp.addEventListener('input', () => {
      const v = MUS.normalizeHex(inp.value);
      if (v) { cur = v; chip.style.background = v; pick.value = v.toLowerCase(); err.textContent = ''; marks.forEach(([b, x]) => b.classList.toggle('on', x === v)); onInput(v); }

  const modal = $('#modal');

  // ------------------------------------------------------------------ Export / Download
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(navigator.userAgent);

  function openExport() {
    endEdit();
    const wrap = h('div');
    let mode = 'crop', result = null, objUrl = null, busy = false;
    const out = h('div');
    const modeSeg = h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Format'));
    const renderModeSeg = () => {
      modeSeg.querySelector('.seg') && modeSeg.querySelector('.seg').remove();
      modeSeg.append(seg([['crop', 'Sticker (zugeschnitten, empfohlen)'], ['story', 'Story 1080 × 1920']], mode, (v) => { mode = v; renderModeSeg(); run(); }));
    };
    renderModeSeg();
    wrap.append(modeSeg, out);
    async function run() {
      if (busy) return; busy = true;
      if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
      out.textContent = '';
      out.append(h('p', { class: 'hint' }, 'PNG wird erstellt …'));
      try {
        result = await MUS.exportPNG(S.layers, mode);
        objUrl = URL.createObjectURL(result.blob);
        const file = new File([result.blob], 'My-UniqueStory-Sticker.png', { type: 'image/png' });
        const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
        out.textContent = '';
        out.append(
          h('div', { class: 'preview-wrap' }, h('img', { src: objUrl, alt: 'Vorschau deines Stickers', id: 'export-preview' })),
          h('p', { class: 'hint', style: 'margin:8px 0 0' }, `${result.width} × ${result.height} Pixel · PNG mit transparentem Hintergrund (das Karomuster gehört nur zur Ansicht)`),
          h('div', { class: 'btn-row' },
            h('button', { class: 'primary', type: 'button', id: 'btn-save-png', onclick: () => {
              const a = h('a', { href: objUrl, download: 'My-UniqueStory-Sticker.png' });
              document.body.append(a); a.click(); a.remove();
              toast('Download gestartet.');
            } }, 'PNG herunterladen'),
            canShare ? h('button', { class: 'secondary', type: 'button', onclick: async () => {
              try { await navigator.share({ files: [file], title: 'My. UniqueStory Sticker' }); }
              catch (e) { if (e && e.name !== 'AbortError') toast('Teilen war nicht möglich. Nutze bitte „PNG herunterladen“.', true); }
            } }, isIOS ? 'Teilen / In Fotos sichern' : 'Teilen / Speichern') : null),
          h('div', { class: 'note' }, isIOS
            ? 'iPhone: Tippe auf „Teilen / In Fotos sichern“ und wähle „Bild sichern“ – dann liegt der Sticker in Fotos. Alternativ: Bild oben gedrückt halten → „Zu Fotos hinzufügen“. Nach „PNG herunterladen“ findest du die Datei in der Dateien-App unter „Downloads“.'
            : isAndroid ? 'Android/Samsung: „PNG herunterladen“ legt die Datei im Ordner „Downloads“ ab – du findest sie in der Galerie oder in „Meine Dateien“. Über „Teilen / Speichern“ kannst du sie direkt in andere Apps senden. Tipp: Bild gedrückt halten → „Bild herunterladen“.'
              : 'Die Datei wird in deinem Download-Ordner gespeichert. Auf dem Smartphone findest du hier Hinweise zum Speichern in Fotos bzw. Galerie.'));
      } catch (e) {
        out.textContent = '';
        out.append(h('div', { class: 'note', role: 'alert', style: 'background:#fde7e5' }, e.message || 'Der Export ist fehlgeschlagen.'),
          h('div', { class: 'btn-row' }, e.empty ? null : h('button', { class: 'primary', type: 'button', onclick: run }, 'Erneut versuchen')));
      } finally { busy = false; }
    }
    openModal('Sticker als PNG speichern', wrap, () => { if (objUrl) URL.revokeObjectURL(objUrl); });
    run();
  }

    const wrap = h('div');
    const nameInp = h('input', { type: 'text', maxlength: 80, value: S.projectName || '', placeholder: 'Projektname, z. B. „Guten Morgen“', 'aria-label': 'Projektname' });
    const msg = h('div', { class: 'err-msg', role: 'alert' });
    const list = h('div');
    const saveRow = h('div', { class: 'btn-row' });
    async function save(asNew) {
      msg.textContent = '';
      try {
        const name = nameInp.value.trim() || 'Mein Sticker';
        const data = { layers: S.layers };
        if (S.projectId && !asNew) await api('PUT', '/api/projects/' + S.projectId, { name, data });
        else { const r = await api('POST', '/api/projects', { name, data }); S.projectId = r.id; }
        S.projectName = name; autosaveSoon();
        toast('Projekt gespeichert.');
        refresh();
      } catch (e) { msg.textContent = e.message; }
    }
    async function refresh() {
      saveRow.textContent = '';
      saveRow.append(h('button', { class: 'primary', type: 'button', onclick: () => save(false) }, S.projectId ? 'Änderungen speichern' : 'Projekt speichern'),
        S.projectId ? h('button', { class: 'secondary', type: 'button', onclick: () => save(true) }, 'Als neues Projekt') : null);
      list.textContent = '';
      try {
        const r = await api('GET', '/api/projects');
        if (!r.projects.length) list.append(h('p', { class: 'hint' }, 'Noch keine gespeicherten Projekte.'));
        r.projects.forEach((p) => list.append(h('div', { class: 'proj' },
          h('div', { class: 'meta' }, h('b', {}, p.name), h('small', {}, new Date(p.updated).toLocaleString('de-DE'))),
          h('button', { class: 'secondary', type: 'button', onclick: () => openProject(p.id) }, 'Öffnen'),
          h('button', { class: 'icon-btn danger', type: 'button', title: 'Löschen', 'aria-label': 'Projekt löschen', html: ico('trash'), onclick: async () => {
            if (!confirm(`Projekt „${p.name}“ wirklich löschen?`)) return;
            try { await api('DELETE', '/api/projects/' + p.id); if (S.projectId === p.id) { S.projectId = null; } refresh(); } catch (e) { msg.textContent = e.message; }
          } }))));
      } catch (e) { list.append(h('p', { class: 'err-msg' }, e.message)); }
    }
    async function openProject(id) {
      try {
        const p = await api('GET', '/api/projects/' + id);
        const layers = (p.data.layers || []).map(normalizeLayer).filter(Boolean);
        S.editingId = null; S.layers = layers; S.selId = null; S.projectId = p.id; S.projectName = p.name;
        preloadAssets(); buildOverlay(); schedule(); renderPanel(); pushHistory();
        closeModal(); toast(`„${p.name}“ geöffnet.`);
      } catch (e) { msg.textContent = e.message; }
    }
    wrap.append(
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, 'Name'), nameInp), saveRow, msg,
      h('div', { class: 'note' }, 'Deine Projekte werden privat gespeichert – nur du siehst sie, ganz ohne Anmeldung. Sie sind an diesen Browser auf diesem Gerät gebunden: Wenn du Website-Daten löschst oder ein anderes Gerät benutzt, findest du sie dort nicht. Für einen fertigen Sticker nutzt du oben „Download“ (PNG).'),
      h('div', { class: 'section-sep' }), h('span', { class: 'lbl' }, 'Meine gespeicherten Projekte'), list,
      h('div', { class: 'btn-row' }, h('button', { class: 'secondary danger', type: 'button', onclick: () => {
        if (!confirm('Neues leeres Projekt beginnen? Nicht gespeicherte Änderungen gehen verloren (Rückgängig bleibt möglich).')) return;
        S.layers = []; S.selId = null; S.editingId = null; S.projectId = null; S.projectName = '';
        buildOverlay(); schedule(); renderPanel(); pushHistory(); closeModal();
      } }, 'Neues leeres Projekt')));
    openModal('Meine Projekte', wrap);
    refresh();
  }

  // ------------------------------------------------------------------ Tastatur
  let keyMoveTimer = 0;
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && !typing) {
      const k = e.key.toLowerCase();
      if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (k === 'y') { e.preventDefault(); redo(); return; }
    }
    if (typing) return;
    if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
    const L = sel();
    if (e.key === 'Escape') { deselect(); return; }
    if (!L) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteLayer(L.id); return; }
    const step = e.shiftKey ? 10 : 1;
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (mv) { e.preventDefault(); L.x = clamp(L.x + mv[0], 0, ART_W); L.y = clamp(L.y + mv[1], 0, ART_H); schedule(); positionOverlay(); clearTimeout(keyMoveTimer); keyMoveTimer = setTimeout(pushHistory, 400); }
  });
  $('#btn-undo').innerHTML = ico('undo'); $('#btn-redo').innerHTML = ico('redo');
  $('#btn-undo').addEventListener('click', undo); $('#btn-redo').addEventListener('click', redo);
  $('.dl-ico').innerHTML = ico('download');
  $('#btn-download').addEventListener('click', openExport);

  // ------------------------------------------------------------------ Tastatur-/Viewport-Anpassung (Smartphone)
  const app = $('#app');
  function onViewport() {
    const vv = window.visualViewport;
    if (!vv) return;
    app.style.height = vv.height + 'px';
    const kbd = mobileMQ.matches && !!S.editingId && window.innerHeight - vv.height > 120;
    document.body.classList.toggle('kbd', kbd);
    if (kbd) window.scrollTo(0, 0);
    fit();
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', onViewport); visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0)); }
  new ResizeObserver(() => fit()).observe(stage);
  mobileMQ.addEventListener('change', () => { syncPanelVisibility(); markTool(); });
  window.addEventListener('beforeunload', () => { try { localStorage.setItem('mus.draft', JSON.stringify({ layers: S.layers, projectId: S.projectId, projectName: S.projectName })); } catch { /* egal */ } });
  let lastCat = Date.now();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastCat > 30000) { lastCat = Date.now(); loadCatalog().then(() => { schedule(); if (['font', 'emoji'].includes(S.tool)) renderPanel(true); }); }
  });

  // ------------------------------------------------------------------ Start
  async function init() {
    renderTools();
    await loadCatalog();
    try {
      const d = JSON.parse(localStorage.getItem('mus.draft') || 'null');
      if (d && Array.isArray(d.layers)) {
        S.layers = d.layers.map(normalizeLayer).filter(Boolean);
        S.projectId = typeof d.projectId === 'string' && /^[a-f0-9]{32}$/.test(d.projectId) ? d.projectId : null;
        S.projectName = typeof d.projectName === 'string' ? d.projectName.slice(0, 80) : '';
        S.layers = S.layers.filter((l) => l.type !== 'text' || /\S/.test(l.text));
      }
    } catch { /* kein Entwurf */ }
    preloadAssets();
    S.history = [snapshot()]; S.keys = [layersKey()]; S.hi = 0;
    afterChange(true);
    syncPanelVisibility();
    fit(); renderPanel(); markTool();
    document.documentElement.dataset.ready = '1';
  }
  init();
})();

</script>
</body>
</html>
